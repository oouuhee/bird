<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>생일 축하 비행 궤적 v5 - Stable Fullscreen Bound</title>
	<style>
		body, html {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: radial-gradient(circle, #638cb3 0%, #4a6d91 100%);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		}

		/* 빈티지 종이 질감 효과 */
		body::before {
			content: "";
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
			opacity: 0.4;
			pointer-events: none;
			z-index: 1;
		}

		#canvasContainer {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 2;
		}

		canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		.control-panel {
			position: absolute;
			bottom: 25px;
			z-index: 10;
			background: rgba(255, 255, 255, 0.15);
			backdrop-filter: blur(10px);
			padding: 10px 18px; 
			border-radius: 20px;
			display: flex;
			gap: 15px;
			align-items: center;
			border: 1px solid rgba(255, 255, 255, 0.3);
			box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
		}

		.inputs-group {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.row-top {
			display: flex;
			gap: 8px;
			align-items: center;
			width: 240px; 
		}

		.row-bottom {
			display: flex;
			width: 240px;
		}

		.buttons-group {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		input {
			padding: 4px;
			border: none;
			border-bottom: 2px solid white;
			background: transparent;
			color: white;
			text-align: center; 
			font-size: 14px;
			outline: none;
			font-family: inherit;
			-moz-appearance: textfield;
			ime-mode: active; 
		}

		input::-webkit-outer-spin-button,
		input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		#nameInput { width: 110px; }
		#monthInput { width: 35px; }
		#dayInput { width: 35px; }
		#phoneInput { width: 100%; }

		input::placeholder {
			color: rgba(255, 255, 255, 0.55);
			text-align: center; 
		}

		button#flyBtn, button#infoBtn {
			background: white;
			color: #4a6d91;
			border: none;
			padding: 8px 16px;
			border-radius: 12px;
			cursor: pointer;
			font-weight: bold;
			font-size: 13px;
			transition: all 0.3s ease;
			white-space: nowrap;
			width: 100%;
			box-sizing: border-box;
		}

		button#infoBtn {
			background: rgba(255, 255, 255, 0.2);
			color: white;
			border: 1px solid rgba(255, 255, 255, 0.2);
			padding: 4px 16px;
			font-size: 11px;
			border-radius: 8px;
		}

		button#flyBtn:hover { background: #e6f0fa; transform: scale(1.03); }
		button#infoBtn:hover { background: rgba(255, 255, 255, 0.35); }

		.info-text {
			position: absolute;
			top: 25px;
			color: rgba(255, 255, 255, 0.5);
			font-size: 13px;
			letter-spacing: 3px;
			z-index: 2;
			pointer-events: none;
			text-align: center;
			font-family: 'Courier New', Courier, monospace;
		}

		.footprint-tooltip {
			position: absolute;
			z-index: 100;
			background: rgba(255, 255, 255, 0.85);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			color: #2c3e50;
			padding: 10px 14px;
			border-radius: 12px;
			font-size: 13px;
			line-height: 1.4;
			pointer-events: none;
			box-shadow: 0 4px 20px rgba(0,0,0,0.12);
			border: 1px solid rgba(255,255,255,0.3);
			width: 190px;   
			box-sizing: border-box;
			word-break: break-all;
		}

		.tooltip-comments {
			margin-top: 6px;
			padding-top: 6px;
			border-top: 1px dashed rgba(44, 62, 80, 0.2);
			font-size: 12px;
			color: #34495e;
			text-align: left; 
		}

		.comment-box {
			position: absolute;
			z-index: 101;
			background: rgba(255, 255, 255, 0.25);
			backdrop-filter: blur(15px);
			-webkit-backdrop-filter: blur(15px);
			padding: 14px;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.15);
			display: flex;
			flex-direction: column;
			gap: 10px;
			width: 220px;          
			height: 160px;         
			box-sizing: border-box;
			border: 1px solid rgba(255, 255, 255, 0.3);
		}

		.comment-box span {
			color: white;
			font-size: 12px;
			font-weight: bold;
			text-shadow: 0 1px 2px rgba(0,0,0,0.1);
			display: block;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			padding-right: 15px; 
		}

		.comment-box textarea {
			width: 100%;
			height: 68px;          
			border: 1px solid rgba(255, 255, 255, 0.4);
			background: rgba(255, 255, 255, 0.6);
			color: #2c3e50;
			border-radius: 10px;
			padding: 8px;
			resize: none;
			font-size: 13px;
			outline: none;
			box-sizing: border-box;
			font-family: inherit;
		}

		.comment-box textarea::placeholder {
			color: rgba(44, 62, 80, 0.6);
		}

		.comment-box button.save-msg-btn {
			background: white;
			color: #4a6d91;
			border: none;
			padding: 6px;
			border-radius: 10px;
			font-size: 13px;
			font-weight: bold;
			cursor: pointer;
			transition: background 0.2s;
			width: 100%;
			box-sizing: border-box;
		}

		.comment-box button.save-msg-btn:hover { background: #e6f0fa; }

		.modal-close-x {
			position: absolute;
			top: 12px;
			right: 16px;
			font-size: 18px;
			font-weight: bold;
			color: rgba(255, 255, 255, 0.7);
			cursor: pointer;
			transition: color 0.2s;
			user-select: none;
			line-height: 1;
		}
		.modal-close-x:hover { color: white; }

		.large-info-modal {
			position: fixed; 
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%); 
			z-index: 200;
			background: rgba(255, 255, 255, 0.25);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid rgba(255, 255, 255, 0.35);
			padding: 28px 24px 24px 24px;
			border-radius: 24px;
			width: 85%;
			max-width: 440px;
			box-shadow: 0 20px 50px rgba(0,0,0,0.3);
			color: white;
			display: none;
			flex-direction: column;
			gap: 14px;
			box-sizing: border-box;
		}

		.large-info-modal p {
			margin: 0;
			font-size: 13.5px;
			line-height: 1.7;
			text-shadow: 0 1px 2px rgba(0,0,0,0.1);
			word-break: keep-all;
			text-align: left; 
		}
	</style>
</head>
<body>

	<div class="info-text">CONTINUE THE BIRTHDAY ORBIT</div>
	
	<div id="canvasContainer">
		<canvas id="artCanvas"></canvas>
		
		<div id="tooltipLayer"></div>
		<div id="commentLayer"></div>

		<div id="largeInfoModal" class="large-info-modal">
			<div id="closeInfoX" class="modal-close-x">&times;</div>
			<p style="font-weight: bold; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; margin-bottom: 4px; text-align: left;">생일 축하 궤적 안내서</p>
			<p>생일 축하 궤도에 오신 걸 환영합니다.</p>
			<p>당신에게 의미 있는 사람의 이름 혹은 별명을 적고 생일을 입력해주세요.</p>
			<p>축하새가 당신이 적은 생일로 날아가 기록합니다.</p>
			<p>누군가의 생일 시간이 되면 알람이 울리고 발자국이 빛납니다.</p>
			<p>누군가의 이름과 생일을 확인하고 축하의 메시지를 남길 수도 있습니다.</p>
			<p>전화번호를 적으신다면 해당 번호로 남겨진 메시지를 다음 날 생일 시간에 맞추어 보내드립니다.</p>
			<p>누군가의 생일을 함께 축하해보는 건 어떨까요?</p>
		</div>
	</div>

	<div class="control-panel">
		<div class="inputs-group">
			<div class="row-top">
				<input type="text" id="nameInput" placeholder="이름/별명" autofocus>
				<input type="number" id="monthInput" placeholder="월">
				<span style="color: white; font-size: 16px;">/</span>
				<input type="number" id="dayInput" placeholder="일">
			</div>
			<div class="row-bottom">
				<input type="text" id="phoneInput" placeholder="전화번호 (선택사항)">
			</div>
		</div>
		<div class="buttons-group">
			<button id="infoBtn">안내문</button>
			<button id="flyBtn">날아가기</button>
		</div>
	</div>

	<script>
		const canvas = document.getElementById('artCanvas');
		const ctx = canvas.getContext('2d');
		const tooltipLayer = document.getElementById('tooltipLayer');
		const commentLayer = document.getElementById('commentLayer');
		const largeInfoModal = document.getElementById('largeInfoModal');

		const flightTrailCanvas = document.createElement('canvas');
		const flightTrailCtx = flightTrailCanvas.getContext('2d');

		let w = window.innerWidth;
		let h = window.innerHeight;
		let minY = 80;
		let maxY = h - 110;
		let safeW, safeH;

		function resize() {
			w = window.innerWidth;
			h = window.innerHeight;
			maxY = h - 110;
			safeW = w - 120; 
			safeH = maxY - minY;

			const temp = document.createElement('canvas');
			temp.width = flightTrailCanvas.width;
			temp.height = flightTrailCanvas.height;
			temp.getContext('2d').drawImage(flightTrailCanvas, 0, 0);

			canvas.width = w;
			canvas.height = h;
			flightTrailCanvas.width = w;
			flightTrailCanvas.height = h;

			flightTrailCtx.drawImage(temp, 0, 0, w, h);
			updateOrbitBounds();
		}
		window.addEventListener('resize', resize);

		function calculateCoordinates(month, day) {
			const paddingX = 60; 
			const x = paddingX + ((day - 1) / 30) * safeW;
			const y = minY + ((month - 1) / 11) * safeH;
			return { x, y };
		}

		w = window.innerWidth;
		h = window.innerHeight;
		safeW = w - 120;
		safeH = maxY - minY;
		canvas.width = w;
		canvas.height = h;
		flightTrailCanvas.width = w;
		flightTrailCanvas.height = h;

		const startPos = calculateCoordinates(11, 28);

		let bird = {
			x: startPos.x, y: startPos.y,
			targetX: startPos.x, targetY: startPos.y,
			angle: -Math.PI / 4, speed: 0.015, t: 1,       
			p0: {x: startPos.x, y: startPos.y},
			p1: {x: startPos.x, y: startPos.y},
			p2: {x: startPos.x, y: startPos.y},
			p3: {x: startPos.x, y: startPos.y},
			hasLanded: false 
		};

		let cachedInputData = {
			name: "오빠",
			phone: "010-0000-0000"
		};

		let footprints = [];
		let glowPulse = 0; 
		let spaceTime = 0; 
		let isEditingComment = false; 

		let backgroundOrbits = [];
		let backgroundDots = [];
		const maxDotsCount = 70; 

		function updateOrbitBounds() {
			backgroundOrbits = [];
			for(let i = 0; i < 4; i++) {
				backgroundOrbits.push({
					currentRotation: (i * 40) * Math.PI / 180,
					rotationSpeed: 0.0012 * (1 - i * 0.15) * (i % 2 === 0 ? 1 : -1), 
					rx: safeW * (0.14 + i * 0.035), 
					ry: safeH * (0.11 + i * 0.035) 
				});
			}
		}

		function initBackgroundData() {
			updateOrbitBounds();
			backgroundDots = [];
			for(let i = 0; i < maxDotsCount; i++) {
				backgroundDots.push(createNewDot(true));
			}
			addFootprint(startPos.x, startPos.y, bird.angle, 11, 28, "오빠", "010-0000-0000");
		}

		function createNewDot(isInitial = false) {
			return {
				x: Math.random() * (safeW - 40) + 80,
				y: Math.random() * (safeH - 40) + minY + 20,
				baseR: 1.0 + Math.random() * 2.1,
				currentR: isInitial ? (1.0 + Math.random() * 2.1) : 0.1,
				alpha: isInitial ? (0.15 + Math.random() * 0.35) : 0,
				pulseSpeed: 0.015 + Math.random() * 0.025, 
				pulseTime: Math.random() * Math.PI,
				state: isInitial ? 'pulsing' : 'fadeIn',
				lifeTime: 220 + Math.random() * 300, 
				age: 0
			};
		}

		function addFootprint(x, y, angle, month, day, name, phone) {
			footprints.push({ 
				x, y, angle, month, day, 
				name: name || "익명의 새", 
				phone: phone || "미기재",
				commentsList: [] 
			});
		}

		function drawDynamicBackground() {
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
			ctx.lineWidth = 2.5;
			const centerY = minY + safeH / 2;

			backgroundOrbits.forEach(orbit => {
				ctx.save();
				ctx.translate(w / 2, centerY);
				orbit.currentRotation += orbit.rotationSpeed;
				ctx.rotate(orbit.currentRotation);
				ctx.beginPath();
				ctx.ellipse(0, 0, orbit.rx, orbit.ry, 0, 0, 2 * Math.PI);
				ctx.stroke();
				ctx.restore();
			});

			backgroundDots.forEach((dot, index) => {
				dot.age++;
				dot.pulseTime += dot.pulseSpeed;
				if (dot.state === 'fadeIn') {
					dot.alpha += 0.01;
					dot.currentR += 0.05;
					if (dot.alpha >= 0.45) { dot.alpha = 0.45; dot.state = 'pulsing'; if(Math.random() > 0.93) playDotSound(); }
				} else if (dot.state === 'pulsing') {
					dot.currentR = dot.baseR + Math.sin(dot.pulseTime) * 0.7;
					if (Math.sin(dot.pulseTime) > 0.99 && Math.random() > 0.98) { playDotSound(); }
					if (dot.age >= dot.lifeTime) { dot.state = 'fadeOut'; }
				} else if (dot.state === 'fadeOut') {
					dot.alpha -= 0.01;
					dot.currentR -= 0.03;
					if (dot.alpha <= 0) { backgroundDots[index] = createNewDot(false); }
				}
				if (dot.currentR < 0.4) dot.currentR = 0.4;
				ctx.save();
				ctx.fillStyle = `rgba(255, 255, 255, ${dot.alpha})`;
				ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.currentR, 0, Math.PI * 2); ctx.fill();
				ctx.restore();
			});
		}

		let audioCtx = null;
		let windOsc = null;
		let windGain = null;
		let activeGlowKeys = new Set(); 

		function initAudio() {
			if (!audioCtx) {
				audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			}
			if (audioCtx.state === 'suspended') {
				audioCtx.resume();
			}
		}

		function playDotSound() {
			if (!audioCtx) return;
			const osc = audioCtx.createOscillator();
			const gain = audioCtx.createGain();
			const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
			const freq = scale[Math.floor(Math.random() * scale.length)];
			osc.type = 'sine';
			osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
			gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
			gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
			osc.connect(gain);
			gain.connect(audioCtx.destination);
			osc.start();
			osc.stop(audioCtx.currentTime + 1.8);
		}

		function playWindSound() {
			if (!audioCtx) return;
			stopWindSound();
			windOsc = audioCtx.createOscillator();
			windGain = audioCtx.createGain();
			windOsc.type = 'sine';
			windOsc.frequency.setValueAtTime(880, audioCtx.currentTime);
			windOsc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
			const filter = audioCtx.createBiquadFilter();
			filter.type = 'highpass'; 
			filter.frequency.setValueAtTime(1500, audioCtx.currentTime); 
			windGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
			windGain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 0.1); 
			windGain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.8);
			windOsc.connect(filter);
			filter.connect(windGain);
			windGain.connect(audioCtx.destination);
			windOsc.start();
		}

		function stopWindSound() {
			if (windOsc && windGain) {
				try {
					windGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3); 
					windOsc.stop(audioCtx.currentTime + 0.3);
				} catch(e) {}
				windOsc = null; windGain = null;
			}
		}

		function playGlowMelody(key) {
			if (!audioCtx || activeGlowKeys.has(key)) return;
			activeGlowKeys.add(key);
			let playCount = 0;
			const melody = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
			const timer = setInterval(() => {
				if (playCount > 25 || !activeGlowKeys.has(key) || !audioCtx) {
					clearInterval(timer); return;
				}
				const osc = audioCtx.createOscillator();
				const gain = audioCtx.createGain();
				const note = melody[playCount % melody.length];
				osc.type = 'sine';
				osc.frequency.setValueAtTime(note, audioCtx.currentTime);
				gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
				osc.connect(gain);
				gain.connect(audioCtx.destination);
				osc.start();
				osc.stop(audioCtx.currentTime + 1.5);
				playCount++;
			}, 600);
			setTimeout(() => { clearInterval(timer); }, 15000);
		}

		function renderSingleFootprint(ctxLayer, fp, currentHour, currentMin) {
			ctxLayer.save();
			ctxLayer.translate(fp.x, fp.y);
			ctxLayer.rotate(fp.angle);

			let normalizedHour = currentHour % 12;
			if (normalizedHour === 0) normalizedHour = 12; 

			const isTimeSynced = (normalizedHour === fp.month && currentMin === fp.day);

			if (isTimeSynced) {
				ctxLayer.shadowColor = '#ffffff'; ctxLayer.shadowBlur = 12 + Math.sin(glowPulse) * 9; 
				ctxLayer.strokeStyle = '#ffffff'; ctxLayer.lineWidth = 3.5;
				const fKey = `${fp.x}_${fp.y}_${fp.month}_${fp.day}`;
				playGlowMelody(fKey);
			} else {
				ctxLayer.strokeStyle = 'rgba(255, 255, 255, 0.75)'; ctxLayer.lineWidth = 2.2;
				const fKey = `${fp.x}_${fp.y}_${fp.month}_${fp.day}`;
				if(activeGlowKeys.has(fKey) && !isTimeSynced) activeGlowKeys.delete(fKey);
			}

			ctxLayer.beginPath();
			ctxLayer.moveTo(0, 0); ctxLayer.lineTo(-10, 0); 
			ctxLayer.moveTo(0, 0); ctxLayer.lineTo(-8, -6); 
			ctxLayer.moveTo(0, 0); ctxLayer.lineTo(-8, 6); 
			ctxLayer.stroke();
			ctxLayer.restore();
		}

		function drawPicassoBird(c, x, y, angle, scale = 0.45) {
			c.save(); c.translate(x, y); c.rotate(angle); c.scale(scale, scale);
			c.strokeStyle = 'rgba(255, 255, 255, 0.95)'; c.fillStyle = 'rgba(255, 255, 255, 0.85)'; c.lineWidth = 5;
			c.lineCap = 'round'; c.lineJoin = 'round';
			c.beginPath();
			c.moveTo(0, 0); c.quadraticCurveTo(20, -10, 40, -5); c.lineTo(30, 5); c.quadraticCurveTo(20, 10, 25, -2);
			c.bezierCurveTo(10, -40, -20, -60, -50, -60);
			c.lineTo(-40, -45); c.lineTo(-60, -40); c.lineTo(-45, -25); c.lineTo(-70, -15);
			c.bezierCurveTo(-50, 20, -20, 50, -40, 80);
			c.lineTo(-20, 70); c.lineTo(-10, 90); c.lineTo(0, 60);
			c.bezierCurveTo(30, 40, 20, 10, 25, -2);
			c.closePath(); c.fill(); 
			c.beginPath();
			c.moveTo(0, 0); c.quadraticCurveTo(20, -10, 40, -5); c.moveTo(40, -5); c.lineTo(30, 5); 
			c.moveTo(25, -2); c.bezierCurveTo(10, -40, -20, -60, -50, -60);
			c.lineTo(-40, -45); c.lineTo(-60, -40); c.lineTo(-45, -25); c.lineTo(-70, -15);
			c.bezierCurveTo(-50, 20, -20, 50, -40, 80); c.lineTo(-20, 70); c.lineTo(-10, 90); c.lineTo(0, 60);
			c.bezierCurveTo(30, 40, 20, 10, 25, -2);
			c.stroke();
			c.strokeStyle = 'rgba(255, 255, 255, 0.8)'; c.lineWidth = 3;
			c.beginPath(); c.moveTo(35, -2); c.lineTo(60, -15); c.stroke();
			c.beginPath(); c.arc(50, -15, 3.5, 0, Math.PI*2); c.fillStyle = 'white'; c.fill();
			c.beginPath(); c.arc(60, -10, 3.5, 0, Math.PI*2); c.fill();
			c.beginPath(); c.arc(20, -8, 2.5, 0, Math.PI * 2); c.fillStyle = '#4a6d91'; c.fill();
			c.restore();
		}

		function getBezierPoint(p0, p1, p2, p3, t) {
			const cx = 3 * (p1.x - p0.x); const bx = 3 * (p2.x - p1.x) - cx; const ax = p3.x - p0.x - cx - bx;
			const cy = 3 * (p1.y - p0.y); const by = 3 * (p2.y - p1.y) - cy; const ay = p3.y - p0.y - cy - by;
			const x = (ax * Math.pow(t, 3)) + (bx * Math.pow(t, 2)) + (cx * t) + p0.x;
			const y = (ay * Math.pow(t, 3)) + (by * Math.pow(t, 2)) + (cy * t) + p0.y;
			return { x, y };
		}

		function mainLoop() {
			ctx.clearRect(0, 0, w, h);
			const now = new Date(); const currentHour = now.getHours(); const currentMin = now.getMinutes();
			glowPulse += 0.08; spaceTime += 0.5; 
			
			drawDynamicBackground(); 
			ctx.drawImage(flightTrailCanvas, 0, 0);

			footprints.forEach(fp => { renderSingleFootprint(ctx, fp, currentHour, currentMin); });

			if (bird.t < 1) {
				let oldX = bird.x; let oldY = bird.y;
				bird.t += bird.speed;
				if (bird.t >= 1) { bird.t = 1; bird.hasLanded = true; stopWindSound(); }
				
				let pos = getBezierPoint(bird.p0, bird.p1, bird.p2, bird.p3, bird.t);
				bird.x = pos.x; bird.y = pos.y;
				bird.angle = Math.atan2(bird.y - oldY, bird.x - oldX);

				flightTrailCtx.strokeStyle = 'rgba(255, 255, 255, 0.75)'; 
				flightTrailCtx.lineWidth = 3;
				flightTrailCtx.beginPath(); 
				flightTrailCtx.moveTo(oldX, oldY); 
				flightTrailCtx.lineTo(bird.x, bird.y); 
				flightTrailCtx.stroke();

				if (bird.hasLanded) {
					addFootprint(bird.x, bird.y, bird.angle, bird.currentFlightMonth, bird.currentFlightDay, bird.currentName, bird.currentPhone);
					bird.hasLanded = false; 
				}
			}
			drawPicassoBird(ctx, bird.x, bird.y, bird.angle);
			requestAnimationFrame(mainLoop);
		}

		function startFlight() {
			initAudio(); if (bird.t < 1) return; 
			const nameInput = document.getElementById('nameInput'); const monthInput = document.getElementById('monthInput');
			const dayInput = document.getElementById('dayInput'); const phoneInput = document.getElementById('phoneInput');
			
			const name = nameInput.value.trim(); const m = parseInt(monthInput.value);
			const d = parseInt(dayInput.value); const phone = phoneInput.value.trim();

			if (!name) { alert('이름 또는 별명을 입력해주세요!'); nameInput.focus(); return; }
			if (isNaN(m) || m < 1 || m > 12 || isNaN(d) || d < 1 || d > 31) { alert('올바른 월/일을 입력해주세요!'); return; }

			const target = calculateCoordinates(m, d);
			bird.p0 = { x: bird.x, y: bird.y }; bird.p3 = { x: target.x, y: target.y };
			bird.currentFlightMonth = m; bird.currentFlightDay = d; bird.currentName = name; bird.currentPhone = phone;
			cachedInputData.name = name; cachedInputData.phone = phone;

			const directionModifier = Math.random() > 0.5 ? 1 : -1;
			
			let cp1x = bird.x + (Math.random() * 200 - 100) + (w * 0.18 * directionModifier);
			let cp1y = bird.y + (Math.random() * 200 - 100) - (safeH * 0.15 * directionModifier);
			let cp2x = target.x + (Math.random() * 200 - 100) - (w * 0.18 * directionModifier);
			let cp2y = target.y + (Math.random() * 200 - 100) + (safeH * 0.15 * directionModifier);

			bird.p1 = { x: Math.max(50, Math.min(w - 50, cp1x)), y: Math.max(minY + 30, Math.min(maxY - 30, cp1y)) };
			bird.p2 = { x: Math.max(50, Math.min(w - 50, cp2x)), y: Math.max(minY + 30, Math.min(maxY - 30, cp2y)) };

			bird.t = 0; playWindSound();
			nameInput.value = ''; monthInput.value = ''; dayInput.value = ''; phoneInput.value = ''; nameInput.focus();
		}

		function getFootprintsAtPosition(mx, my) {
			let matchedIndices = [];
			for (let i = 0; i < footprints.length; i++) {
				let fp = footprints[i];
				let dist = Math.hypot(mx - fp.x, my - fp.y);
				if (dist < 15) { matchedIndices.push(i); }
			}
			return matchedIndices;
		}

		canvas.addEventListener('mousemove', (e) => {
			if (isEditingComment) return; 
			const rect = canvas.getBoundingClientRect();
			const mx = e.clientX - rect.left;
			const my = e.clientY - rect.top;

			const foundIndices = getFootprintsAtPosition(mx, my);
			tooltipLayer.innerHTML = "";

			if (foundIndices.length > 0) {
				let startX = mx + 15;
				let startY = my - 15;

				foundIndices.forEach((idx, loopIdx) => {
					let fp = footprints[idx];
					const el = document.createElement('div');
					el.className = 'footprint-tooltip';
					
					let innerStr = `<strong>${fp.name}</strong>`;
					if (fp.commentsList && fp.commentsList.length > 0) {
						innerStr += `<div class="tooltip-comments">`;
						fp.commentsList.forEach(item => {
							innerStr += `<div><strong>${item.author}</strong>: ${item.text}</div>`;
						});
						innerStr += `</div>`;
					}
					el.innerHTML = innerStr;

					let currentX = startX + (loopIdx * 195);
					let currentY = startY;

					if (currentX + 190 > w) {
						currentX = mx - 205 - ((loopIdx) * 195);
					}
					if (currentY + 120 > h) currentY = h - 130;
					if (currentY < 10) currentY = 10;

					let finalX = Math.max(10, Math.min(w - 200, currentX));
					let finalY = Math.max(10, Math.min(h - 130, currentY));

					el.style.left = finalX + 'px';
					el.style.top = finalY + 'px';
					el.style.display = 'block';
					tooltipLayer.appendChild(el);
				});
			}
		});

		canvas.addEventListener('click', (e) => {
			const rect = canvas.getBoundingClientRect();
			const mx = e.clientX - rect.left;
			const my = e.clientY - rect.top;

			const foundIndices = getFootprintsAtPosition(mx, my);
			commentLayer.innerHTML = ""; 

			if (foundIndices.length > 0) {
				isEditingComment = true; 
				let startX = mx + 15;
				let startY = my + 15;

				foundIndices.forEach((idx, loopIdx) => {
					let fp = footprints[idx];
					const box = document.createElement('div');
					box.className = 'comment-box';
					box.id = `commentBox_${idx}`;
					
					box.innerHTML = `
						<div class="modal-close-x" onclick="closeSingleCommentBox(${idx})">&times;</div>
						<span>To. ${fp.name} (${fp.month}/${fp.day})</span>
						<textarea id="commentTextArea_${idx}" placeholder="하고싶은 말을 남겨주세요."></textarea>
						<button class="save-msg-btn" onclick="saveSingleComment(${idx})">보내기</button>
					`;

					let currentX = startX + (loopIdx * 225);
					let currentY = startY;

					if (currentX + 220 > w) {
						currentX = mx - 235 - (loopIdx * 225);
					}
					if (currentY + 160 > h) {
						currentY = h - 180 - (loopIdx * 20);
					}
					if (currentY < 10) currentY = minY + 10;

					let finalX = Math.max(15, Math.min(w - 235, currentX));
					let finalY = Math.max(10, Math.min(h - 175, currentY));

					box.style.left = finalX + 'px';
					box.style.top = finalY + 'px';
					box.style.display = 'flex';
					commentLayer.appendChild(box);
				});

				const firstTextArea = document.getElementById(`commentTextArea_${foundIndices[0]}`);
				if (firstTextArea) firstTextArea.focus();
				tooltipLayer.innerHTML = ""; 
			} else {
				closeAllCommentBoxes();
			}
		});

		window.saveSingleComment = function(idx) {
			const txtArea = document.getElementById(`commentTextArea_${idx}`);
			if (txtArea) {
				const text = txtArea.value.trim();
				if (text) {
					const authorName = cachedInputData.name || "익명";
					footprints[idx].commentsList.push({ author: authorName, text: text });
				}
			}
			closeSingleCommentBox(idx);
		};

		window.closeSingleCommentBox = function(idx) {
			const targetBox = document.getElementById(`commentBox_${idx}`);
			if (targetBox) { targetBox.remove(); }
			if (commentLayer.childElementCount === 0) {
				isEditingComment = false;
			}
		};

		function closeAllCommentBoxes() {
			commentLayer.innerHTML = "";
			isEditingComment = false;
		}

		function exportTxtData() {
			let dataString = "=== BIRTHDAY ORBIT DATA ARCHIVE ===\n\n";
			footprints.forEach((fp, idx) => {
				dataString += `[발자국 #${idx + 1}] 위치인물: ${fp.name} (${fp.month}월 ${fp.day}일) | 연락처: ${fp.phone}\n`;
				if(fp.commentsList && fp.commentsList.length > 0) {
					dataString += `  └─ 남겨진 코멘트:\n`;
					fp.commentsList.forEach(c => { dataString += `     [${c.author}] : ${c.text}\n`; });
				}
				dataString += "--------------------------------------------------\n";
			});
			const blob = new Blob([dataString], { type: "text/plain;charset=utf-8" });
			const link = document.createElement("a");
			link.href = URL.createObjectURL(blob); link.download = "birthday_orbit_data.txt";
			link.click(); URL.revokeObjectURL(link.href);
		}

		// [추가] 1. 관리자 모드: Ctrl + *
		document.addEventListener('keydown', (e) => {
			const activeTag = document.activeElement.tagName.toLowerCase();
			if (activeTag === 'input' || activeTag === 'textarea' || isEditingComment) return; 
			if (e.ctrlKey && e.key === '*') {
				e.preventDefault();
				const pass = prompt("비밀번호를 입력하세요");
				if (pass === "0920") {
					exportTxtData();
					footprints = [];
					flightTrailCtx.clearRect(0, 0, flightTrailCanvas.width, flightTrailCanvas.height);
					alert("저장 완료 및 초기화");
				} else { alert("비밀번호 불일치"); }
			}
		});

		// [추가] 2. 매일 00시 자동 초기화
		setInterval(() => {
			const now = new Date();
			if (now.getHours() === 0 && now.getMinutes() === 0) {
				footprints = [];
				flightTrailCtx.clearRect(0, 0, flightTrailCanvas.width, flightTrailCanvas.height);
			}
		}, 60000);

		document.getElementById('infoBtn').addEventListener('click', () => largeInfoModal.style.display='flex');
		document.getElementById('closeInfoX').addEventListener('click', () => largeInfoModal.style.display='none');
		document.getElementById('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('monthInput').focus(); });
		document.getElementById('monthInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('dayInput').focus(); });
		document.getElementById('dayInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('phoneInput').focus(); });
		document.getElementById('phoneInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') startFlight(); });
		document.getElementById('flyBtn').addEventListener('click', startFlight);
		document.body.addEventListener('click', initAudio, { once: true });
		
		resize();
		initBackgroundData();
		mainLoop();
	</script>
</body>
